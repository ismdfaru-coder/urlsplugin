<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>URL Monitor</h1>
  <div id="config">
    <input type="url" id="url-input" placeholder="Enter URL" />
    <input type="email" id="email-input" placeholder="Enter Notification Email" />
    <button id="add-button">Add URL</button>
  </div>
  <div id="list">
    <h2>Monitoring List</h2>
    <ul id="urls-list"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
